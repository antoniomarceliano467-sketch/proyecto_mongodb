<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - RAG Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            width: 100%;
            max-width: 420px;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background-color: #0b1120;
            color: #ffffff;
            padding: 8px 18px;
            border-radius: 10px;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 24px;
        }

        .badge span {
            background: #ffffff;
            color: #0b1120;
            padding: 2px 5px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 800;
        }

        h2 {
            color: #111827;
            font-size: 24px;
            margin-bottom: 25px;
            font-weight: 700;
        }

        .form-group {
            text-align: left;
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-size: 14px;
            color: #1f2937;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #0066ff;
        }

        .btn {
            width: 100%;
            background-color: #0066ff;
            color: white;
            border: none;
            padding: 13px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #0052cc;
        }

        .btn:disabled {
            background-color: #93c5fd;
            cursor: not-allowed;
        }

        .switch-link {
            margin-top: 22px;
            font-size: 14px;
            color: #6b7280;
        }

        .switch-link a {
            color: #0066ff;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .switch-link a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }

        .msg {
            margin-top: 15px;
            font-size: 13px;
            font-weight: 500;
            padding: 10px;
            border-radius: 6px;
            display: none;
        }

        .msg.error {
            display: block;
            background-color: #fee2e2;
            color: #dc2626;
        }

        .msg.success {
            display: block;
            background-color: #dcfce7;
            color: #16a34a;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="badge"><span>Aa</span> RAG Dashboard</div>

    <!-- 1. VISTA DE INICIO DE SESIÓN -->
    <div id="vista-login">
        <h2>Iniciar Sesión</h2>
        <div class="form-group">
            <label for="login-correo">Correo Electrónico</label>
            <input type="email" id="login-correo" placeholder="tucorreo@ejemplo.com" required>
        </div>
        <div class="form-group">
            <label for="login-password">Contraseña</label>
            <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button class="btn" id="btn-login" onclick="iniciarSesion()">Ingresar al Sistema</button>
        <div class="switch-link">
            ¿No tienes cuenta? <a onclick="cambiarVista('registro')">Regístrate aquí</a>
        </div>
    </div>

    <!-- 2. VISTA DE REGISTRO (CON CONTRASEÑA PERSONALIZADA) -->
    <div id="vista-registro" class="hidden">
        <h2>Crear Cuenta</h2>
        <div class="form-group">
            <label for="reg-correo">Correo Electrónico</label>
            <input type="email" id="reg-correo" placeholder="tucorreo@ejemplo.com" required>
        </div>
        <div class="form-group">
            <label for="reg-password">Crea tu Contraseña</label>
            <input type="password" id="reg-password" placeholder="Escribe tu contraseña" required>
        </div>
        <button class="btn" id="btn-registro" onclick="solicitarCodigo()">Enviar Código de Verificación</button>
        <div class="switch-link">
            ¿Ya tienes cuenta? <a onclick="cambiarVista('login')">Inicia sesión aquí</a>
        </div>
    </div>

    <!-- 3. VISTA DE VERIFICACIÓN OTP -->
    <div id="vista-verificar" class="hidden">
        <h2>Verificar Código</h2>
        <p style="font-size: 13px; color: #6b7280; margin-bottom: 18px;">
            Ingresa el código de 6 dígitos que enviamos a tu correo electrónico.
        </p>
        <div class="form-group">
            <label for="otp-codigo">Código de 6 dígitos</label>
            <input type="text" id="otp-codigo" placeholder="123456" maxlength="6" required>
        </div>
        <button class="btn" id="btn-verificar" onclick="verificarCodigo()">Verificar y Activar Cuenta</button>
        <div class="switch-link">
            <a onclick="cambiarVista('registro')">Volver atrás</a>
        </div>
    </div>

    <!-- MENSAJES DE ESTADO -->
    <div id="mensaje-estado" class="msg"></div>
</div>

<script>
    // URL conectada directamente a tu servidor en Render
    const API_URL = 'https://proyecto-mongodb-7umd.onrender.com';

    let correoEnProceso = '';

    function mostrarMensaje(texto, tipo) {
        const msgDiv = document.getElementById('mensaje-estado');
        msgDiv.textContent = texto;
        msgDiv.className = 'msg ' + tipo;
    }

    function limpiarMensaje() {
        const msgDiv = document.getElementById('mensaje-estado');
        msgDiv.className = 'msg';
        msgDiv.textContent = '';
    }

    function cambiarVista(vista) {
        limpiarMensaje();
        document.getElementById('vista-login').classList.add('hidden');
        document.getElementById('vista-registro').classList.add('hidden');
        document.getElementById('vista-verificar').classList.add('hidden');

        if (vista === 'login') {
            document.getElementById('vista-login').classList.remove('hidden');
        } else if (vista === 'registro') {
            document.getElementById('vista-registro').classList.remove('hidden');
        } else if (vista === 'verificar') {
            document.getElementById('vista-verificar').classList.remove('hidden');
        }
    }

    // 1. FUNCIÓN PARA INICIAR SESIÓN
    async function iniciarSesion() {
        const correo = document.getElementById('login-correo').value.trim();
        const password = document.getElementById('login-password').value.trim();
        const btn = document.getElementById('btn-login');

        if (!correo || !password) {
            mostrarMensaje('Por favor, completa todos los campos.', 'error');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Conectando...';
        limpiarMensaje();

        try {
            const url = `${API_URL}/login?correo=${encodeURIComponent(correo)}&password=${encodeURIComponent(password)}`;
            const respuesta = await fetch(url, { method: 'POST' });
            const datos = await respuesta.json();

            if (respuesta.ok && !datos.error) {
                mostrarMensaje('¡Acceso correcto! Redirigiendo...', 'success');
                localStorage.setItem('usuario_correo', correo);
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1000);
            } else {
                mostrarMensaje(datos.error || datos.detail || 'Credenciales incorrectas.', 'error');
            }
        } catch (error) {
            mostrarMensaje('Error al conectar con el servidor en la nube.', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Ingresar al Sistema';
        }
    }

    // 2. FUNCIÓN PARA REGISTRAR USUARIO Y ENVIAR CÓDIGO
    async function solicitarCodigo() {
        const correo = document.getElementById('reg-correo').value.trim();
        const password = document.getElementById('reg-password').value.trim();
        const btn = document.getElementById('btn-registro');

        if (!correo || !password) {
            mostrarMensaje('Ingresa tu correo y crea una contraseña.', 'error');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Enviando código...';
        limpiarMensaje();

        try {
            const url = `${API_URL}/solicitar-codigo?correo=${encodeURIComponent(correo)}&password=${encodeURIComponent(password)}`;
            const respuesta = await fetch(url, { method: 'POST' });
            const datos = await respuesta.json();

            if (respuesta.ok && !datos.error) {
                correoEnProceso = correo;
                cambiarVista('verificar');
                mostrarMensaje('Código enviado a tu correo.', 'success');
            } else {
                mostrarMensaje(datos.error || datos.detail || 'No se pudo enviar el código.', 'error');
            }
        } catch (error) {
            mostrarMensaje('Error al conectar con el servidor.', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Enviar Código de Verificación';
        }
    }

    // 3. FUNCIÓN PARA VERIFICAR EL CÓDIGO OTP
    async function verificarCodigo() {
        const codigo = document.getElementById('otp-codigo').value.trim();
        const btn = document.getElementById('btn-verificar');

        if (!codigo) {
            mostrarMensaje('Ingresa el código de 6 dígitos.', 'error');
            return;
        }

        btn.disabled = true;
        btn.textContent = 'Verificando...';
        limpiarMensaje();

        try {
            const url = `${API_URL}/verificar-codigo?correo=${encodeURIComponent(correoEnProceso)}&codigo=${encodeURIComponent(codigo)}`;
            const respuesta = await fetch(url, { method: 'POST' });
            const datos = await respuesta.json();

            if (respuesta.ok && !datos.error) {
                cambiarVista('login');
                document.getElementById('login-correo').value = correoEnProceso;
                mostrarMensaje('¡Cuenta verificada! Ya puedes iniciar sesión con tu contraseña.', 'success');
            } else {
                mostrarMensaje(datos.error || datos.detail || 'Código inválido o incorrecto.', 'error');
            }
        } catch (error) {
            mostrarMensaje('Error al verificar el código.', 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Verificar y Activar Cuenta';
        }
    }
</script>

</body>
</html>
